name: deepgvs
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10.18
  - pip
  - pytorch=2.1.0
  - pytorch-cuda=11.8
  - pip:
      - -r requirements.txt
      - fair-esm
      - mamba-ssm
      - transformers==4.30.0

# --- venv alternative (used for the manuscript freeze) ---
# python -m venv /path/to/deepgvs --prompt deepgvs   # with a Python 3.10.18 interpreter
