[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deepgvs"
version = "1.1.0"
description = "DeepGVS: bacterial virulence factor prediction from CDS + Graph-Mamba structure embeddings"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.21.0,<2.0.0",
  "pandas>=1.3.0",
  "scipy>=1.9.0",
  "scikit-learn>=1.3.0,<1.4.0",
  "xgboost>=1.7.0,<3.0.0",
  "joblib>=1.2.0",
  "tqdm>=4.62.0",
  "torch>=2.0.0",
  "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deepgvs = ["*.py"]
