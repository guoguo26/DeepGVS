# Dataset A — train/val/test from paired FASTA (first header token is the ID)
dataset: Dataset_A
seed: 42

features:
  protein_dim: 1792          # graph_mamba_feat_*
  cds_dim: 354
  raw_dim: 2146
  local_window_size: 128
  local_window_step: 128
  orf_max_len_nt: 8192

splits:
  train:
    protein_fasta: Dataset/Dataset_A/protein/train.fasta   # 4999 records
    cds_fasta: Dataset/Dataset_A/CDS/train.fasta
  validation:
    protein_fasta: Dataset/Dataset_A/protein/val.fasta     # 800 records
    cds_fasta: Dataset/Dataset_A/CDS/val.fasta
  test:
    protein_fasta: Dataset/Dataset_A/protein/test.fasta    # 1369 records
    cds_fasta: Dataset/Dataset_A/CDS/test.fasta

model_dir: model/dataset_a
notes: >
  Labels are encoded in FASTA headers in this release snapshot
  (VFG* = virulence factor, non_VF_* = non-VF). The training code
  consumes merged CSVs with an explicit `label` column; see
  scripts/prepare_dataset.py and docs/reproduction.md.
